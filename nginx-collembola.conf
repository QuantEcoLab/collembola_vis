# Nginx configuration for Collembola Detection Pipeline
# Deploy at: advandeb.com/collembola
#
# Installation:
#   sudo cp nginx-collembola.conf /etc/nginx/sites-available/collembola
#   sudo ln -s /etc/nginx/sites-available/collembola /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx

server {
    listen 80;
    server_name advandeb.com;

    # Collembola app location
    location /collembola/ {
        # Try static files first (frontend build)
        root /home/adeb/dev/collembola_vis/frontend/dist;
        try_files $uri $uri/ @collembola_backend;
        
        # Handle SPA routing - index.html for non-existent paths
        error_page 404 = @collembola_spa;
    }

    # SPA fallback - serve index.html for client-side routing
    location @collembola_spa {
        root /home/adeb/dev/collembola_vis/frontend/dist;
        try_files /index.html =404;
    }

    # Backend API endpoints
    location @collembola_backend {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket support for /collembola/ws
    location /collembola/ws {
        proxy_pass http://127.0.0.1:9000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # API endpoints
    location /collembola/api {
        proxy_pass http://127.0.0.1:9000/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # File uploads and outputs
    location /collembola/files {
        proxy_pass http://127.0.0.1:9000/files;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500M;  # Allow large image uploads
    }

    # Assets directory (CSS, JS bundles)
    location /collembola/assets/ {
        alias /home/adeb/dev/collembola_vis/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

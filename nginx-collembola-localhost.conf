# Nginx configuration for Collembola - serves on localhost:8100
# Cloudflare tunnel config should point advandeb.com to this port
# Only handles /collembola path

server {
    listen 127.0.0.1:8100;
    server_name localhost;

    # Root directory for static files
    root /home/adeb/dev/collembola_vis/frontend/dist;

    # Root catches non-collembola paths - return 404
    location = / {
        return 404;
    }

    # Collembola assets directory (CSS, JS bundles) - must come first
    location /collembola/assets/ {
        alias /home/adeb/dev/collembola_vis/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API endpoints
    location /collembola/api {
        proxy_pass http://127.0.0.1:8000/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket support for /collembola/ws
    location /collembola/ws {
        proxy_pass http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # File uploads and outputs
    location /collembola/files {
        proxy_pass http://127.0.0.1:8000/files;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500M;  # Allow large image uploads
    }

    # Collembola frontend - SPA with fallback to index.html
    location /collembola/ {
        alias /home/adeb/dev/collembola_vis/frontend/dist/;
        try_files $uri $uri/ /index.html;
        index index.html;
        
        # Don't cache HTML - always get fresh version
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    location = /collembola {
        return 301 $scheme://$host/collembola/;
    }

    # Catch-all for other paths
    location / {
        return 404;
    }
}
